<!DOCTYPE html>
<html>

<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <title>BizLingo AI</title>

    <meta property="og:title" content="BizLingo AI">
    <meta property="og:description" content="Smart Business English learning app.">
    <meta property="og:image" content="https://vralchenko.github.io/BizLingo/icon.png">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">

    <script src="coi-serviceworker.js"></script>

    <style>
        body {
            background-color: #001B3D;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }

        #custom-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #001B3D;
            display: flex;
            z-index: 999999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #splash-img {
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
            border-radius: 30px;
        }

        .progress-bar {
            width: 280px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #4facfe;
            transition: width 0.3s;
        }

        #status-text {
            font-size: 11px;
            margin-top: 10px;
            color: #00f2fe;
            text-align: center;
        }
    </style>

    <script>
        window.isReady = false;
        window.is_webllm_ready = function () { return window.isReady; };

        window.webllm_validate = async function (userText, targetText) {
            try {
                const response = await fetch("V_GROQ_URL", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer V_GROQ_KEY",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "V_AI_MODEL",
                        messages: [
                            {
                                role: "system",
                                content: "You are a Business English coach. Accept any semantically correct, professional, and natural translation. Answer ONLY with 'YES' or 'NO', then start a new line with 'Reason:' and explain why briefly in Russian."
                            },
                            { role: "user", content: `Goal: "${targetText}" | User translation: "${userText}". Valid? YES/NO and Russian reason.` }
                        ],
                        temperature: 0.3
                    })
                });
                const out = await response.json();
                return out.choices[0].message.content;
            } catch (e) {
                console.error("Groq Error:", e);
                return "NO. Reason: Ошибка подключения к API: " + e.message;
            }
        };

        async function initAI() {
            // Instant ready for presentation
            document.getElementById("status-text").textContent = "Groq AI Engine Ready";
            document.getElementById("progress-fill").style.width = "100%";
            window.isReady = true;
            setTimeout(() => {
                const splash = document.getElementById('custom-splash');
                if (splash) splash.remove();
            }, 500);
        }
        window.addEventListener("load", initAI);
    </script>
</head>

<body>
    <div id="custom-splash">
        <img id="splash-img" src="icon.png">
        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="status-text">Readying AI...</div>
    </div>
    <script src="flutter_bootstrap.js" async></script>
</body>

</html>
