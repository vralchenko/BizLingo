name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: gh-pages
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Inject Environment Variables
        run: |
          sed -i "s|{{GROQ_API_URL}}|${{ vars.GROQ_APT_URL }}|g" web/index.html
          sed -i "s|{{GROQ_API_KEY}}|${{ vars.GROQ_APT_KEY }}|g" web/index.html
          sed -i "s|{{AI_MODEL_NAME}}|${{ vars.AI_MODEL_NAME }}|g" web/index.html

      - name: Build Web
        run: flutter build web --release --base-href "/BizLingo/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web